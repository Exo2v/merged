name: Build Hyrulecraft

on:
  push:
    branches: [ main, arena/**, "arena/2fe62dfd-merged" ]
    paths:
      - "mod/**"
      - ".github/workflows/build.yml"
      - "docs/**"
      - "spec/**"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-fabric:
    name: Fabric 1.21.1 — build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache MC assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            mod/fabric/.gradle
          key: loom-${{ hashFiles('mod/fabric/gradle.properties') }}-${{ runner.os }}
          restore-keys: loom-

      - name: Build Fabric mod (remap + jar)
        working-directory: mod/fabric
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew --version
          ./gradlew build --info --stacktrace

      - name: Verify jar exists
        run: ls -lh mod/fabric/build/libs/

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: hyrulecraft-fabric-1.21.1
          path: |
            mod/fabric/build/libs/*.jar
            !mod/fabric/build/libs/*-sources.jar
            !mod/fabric/build/libs/*-dev-shadow.jar
          if-no-files-found: error

      # Optional: run datagen / lint
      - name: Run datagen check (optional)
        working-directory: mod/fabric
        run: ./gradlew runDatagen --dry-run || echo "No datagen task — ok"

  build-neoforge:
    name: NeoForge 1.21.1 — build (if present)
    runs-on: ubuntu-latest
    if: hashFiles('mod/neoforge/build.gradle') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build NeoForge
        working-directory: mod/neoforge
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew build

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: hyrulecraft-neoforge-1.21.1
          path: mod/neoforge/build/libs/*.jar
          if-no-files-found: warn

  release:
    name: Create prerelease on tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-fabric]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.jar
          generate_release_notes: true
          prerelease: true
