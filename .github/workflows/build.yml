name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./mod/fabric/gradlew
      - name: build Fabric 1.21.1
        run: |
          cd mod/fabric
          ./gradlew build --info
      - name: capture Fabric jar
        uses: actions/upload-artifact@v7
        with:
          name: hyrulecraft-fabric-1.21.1
          path: mod/fabric/build/libs/
      - name: build NeoForge 1.21.1 (if present)
        run: |
          if [ -f mod/neoforge/build.gradle ]; then
            cd mod/neoforge
            chmod +x ./gradlew 2>/dev/null || true
            ./gradlew build --info || echo "NeoForge build skipped (no wrapper)"
          fi
      - name: capture NeoForge jar
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hyrulecraft-neoforge-1.21.1
          path: mod/neoforge/build/libs/
          if-no-files-found: ignore
