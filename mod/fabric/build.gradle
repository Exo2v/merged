plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    maven { url 'https://maven.sodiumlibs.net/' } // Sodium/Lithium optional
    maven { url 'https://api.modrinth.com/maven' }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        hyrulecraft {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    // Access widener if you need to touch private MC fields (camera)
    // accessWidenerPath = file("src/main/resources/hyrulecraft.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Dev-only perf — uncomment to profile with Sodium/Iris:
    // modRuntimeOnly "me.jellysquid.mods:sodium:${sodium_version}"
    // modRuntimeOnly "me.jellysquid.mods:lithium:${lithium_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") { expand "version": project.version, "minecraft_version": project.minecraft_version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "projectName", project.name
    from("LICENSE") { rename { "${it}_${project.archivesBaseName.get()}" } }
    // Shade worldgen/shader assets + include
}

publishing {
    publications { create("mavenJava", MavenPublication) { from components.java } }
}
