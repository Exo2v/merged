# Merged item registry — 42 items
# Each entry: id (oot+mc), type, stack, zTarget, minecraft recipe → oot effect

items:
  - id: kokiri_sword
    display: "Kokiri Sword"
    oot: ITEM_SWORD_KOKIRI
    mc: minecraft:wooden_sword
    recipe: ["stick + flint + vine", "or chest Kokiri Forest"]
    damage: 3
    flags: [ATTENTION_ENABLED]
    note: "First sword; retextured wooden sword. Spin attack mines dirt."

  - id: master_sword
    display: "Master Sword"
    oot: ITEM_SWORD_MASTER
    mc: minecraft:iron_sword
    recipe: ["nether_star + kokiri_sword on time pedestal"]
    damage: 8
    flags: [ATTENTION_ENABLED, HOSTILE]
    effect: "Glows near Ganon-corrupted chunks (sculk sensor). Breaks skulltula webs."

  - id: hookshot
    display: "Hookshot"
    oot: ITEM_HOOKSHOT
    mc: minecraft:crossbow # base
    recipe: ["chain x2 + iron_ingot + hook + redstone"]
    range: 15
    flags: [HOOKSHOT_PULLS_PLAYER, ATTENTION_ENABLED]
    effect: "Raycasts voxels + actors; pulls player if target is IMMOVABLE."

  - id: longshot
    display: "Longshot"
    oot: ITEM_LONGSHOT
    mc: minecraft:crossbow
    recipe: ["hookshot + gold_ingot + rupee(emerald)"]
    range: 30

  - id: fairy_bow
    display: "Fairy Bow"
